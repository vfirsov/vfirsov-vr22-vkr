# Локальный PostgreSQL для разработки. Логин, пароль и имя базы берутся из корневого .env
# (шаблон — .env.example). Сеть называется vkr, чтобы контейнер API подключался
# к БД по адресу vkr-postgres:5432 (см. README, «Настройки localhost»).
services:
  postgres:
    image: postgres:17
    container_name: vkr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  default:
    name: vkr
